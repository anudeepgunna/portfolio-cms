<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>

    <!-- Must precede every relative URL below: <base> only applies to elements
         that follow it, so a stylesheet linked above it would resolve against
         the current path and 404 on nested routes like /admin/login. -->
    <base href="/" />

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- App stylesheet -->
    <link rel="stylesheet" href="app.css" />
    <!-- Records effect calls made before portfolio-fx.js evaluates; the module
         replays them on load. Blazor's boot time makes this unlikely, but a
         lost init would silently disable every animation on the page. -->
    <script>
        window.portfolioFx = {
            _q: [],
            init() { this._q.push(['init', [...arguments]]); },
            refresh() { this._q.push(['refresh', [...arguments]]); },
            dispose() { this._q.push(['dispose', [...arguments]]); }
        };
    </script>

    <!-- Visual effects: WebGL hero backdrop, scroll reveal, pointer tilt.
         Purely additive — the page is complete without it. -->
    <script type="module" src="js/portfolio-fx.js"></script>
</head>
<body>

    <!-- Blazor renders into this div -->
    <div id="app">
        <!-- Loading splash shown while Blazor WASM downloads -->
        <div style="
            display:flex; flex-direction:column; align-items:center;
            justify-content:center; height:100vh;
            background:#0f172a; color:#f8fafc; font-family:Inter,sans-serif;">
            <div class="splash-spinner"></div>
            <p style="margin-top:1.5rem; color:#94a3b8; font-size:14px;">Loading portfolio…</p>
        </div>
    </div>

    <!-- Blazor error UI (shown on unhandled exception) -->
    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- SignalR client (loaded from CDN so no npm needed) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

    <!-- Blazor WASM runtime -->
    <script src="_framework/blazor.webassembly.js"></script>

    <style>
        /* Splash spinner only — full styles are in app.css */
        .splash-spinner {
            width: 48px; height: 48px;
            border: 3px solid #1e293b;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</body>
</html>
