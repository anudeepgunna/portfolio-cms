[build]
  publish = "Main/src"
  command = "echo 'Site is pre-built'"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "production" }

# Ignore unnecessary files
[ignore]
  - tests/
  - docs/
  - .git/
  - *.sln
  - *.csproj
  - Dockerfile
  - docker-compose.yml
